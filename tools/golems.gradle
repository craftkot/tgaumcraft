// Optional M10 test runs. Load with gradle --init-script tools/golems.gradle.
// Keeps the shared build/CI configuration unchanged for parallel work lanes.
allprojects {
    afterEvaluate { project ->
        def neo = project.extensions.findByName('neoForge')
        if (neo != null) {
            neo.runs.create('golemGameTest') {
                type = 'gameTestServer'
                gameDirectory = project.layout.buildDirectory.dir('golem-gametest')
                systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumcraft'
            }
            neo.runs.create('golemFlightStress') {
                type = 'gameTestServer'
                gameDirectory = project.layout.buildDirectory.dir('golem-flight-stress')
                jvmArguments.add '-Xmx1G'
                systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumcraft_golem_stress'
            }
            neo.runs.create('golemClient') {
                client()
                gameDirectory = project.layout.buildDirectory.dir('golem-client')
                jvmArguments.add '-Xmx2G'
                programArguments.addAll '--width', '1280', '--height', '800'
                def remote = project.findProperty('golemRemoteAddress') ?: ''
                if (remote) programArguments.addAll '--quickPlayMultiplayer', remote
                systemProperty 'thaumcraft.golemSealRemoteProbe', (remote != '').toString()
                systemProperty 'thaumcraft.golemClientProbe', 'true'
                systemProperty 'thaumcraft.golemClientScenario', project.findProperty('golemClientScenario') ?: ''
            }
            neo.runs.create('golemSealServer') {
                server()
                gameDirectory = project.layout.buildDirectory.dir('golem-seal-server')
                jvmArguments.add '-Xmx1G'
                systemProperty 'thaumcraft.golemClientProbe', 'true'
                systemProperty 'thaumcraft.golemClientScenario', 'seals'
                systemProperty 'thaumcraft.golemSealRemoteProbe', 'true'
            }
            neo.runs.create('golemCrash') {
                server()
                def kind = project.findProperty('golemCrashCase') ?: 'unsaved'
                if (!(kind in ['unsaved', 'saved', 'split'])) throw new GradleException('Unknown golem crash case')
                gameDirectory = project.layout.buildDirectory.dir('golem-crash-' + kind)
                jvmArguments.add '-Xmx1G'
                systemProperty 'thaumcraft.golemCrashCase', kind
                systemProperty 'thaumcraft.golemCrashPhase', project.findProperty('golemCrashPhase') ?: ''
            }
            neo.runs.create('golemRestart') {
                server()
                def scenario = project.findProperty('golemRestartScenario') ?: ''
                gameDirectory = project.layout.buildDirectory.dir(scenario == 'seeded_cross' ? 'golem-seed-cross-restart' : scenario == 'seeded' ? 'golem-seed-restart' : scenario == 'clickable' ? 'golem-clickable-restart' : scenario == 'press_chunk' ? 'golem-press-chunk-unload' : scenario == 'chunk' ? 'golem-chunk-unload' : scenario == 'dart' ? 'golem-dart-restart' : scenario == 'flyer' ? 'golem-flyer-restart' : scenario == 'climber' ? 'golem-climber-restart' : scenario == 'guard' ? 'golem-guard-restart' : scenario == 'use' ? 'golem-use-restart' : scenario == 'silk' ? 'golem-silk-restart' : scenario == 'lumber' ? 'golem-lumber-restart' : scenario == 'breaker' ? 'golem-breaker-restart' : scenario == 'advanced' ? 'golem-advanced-restart' : scenario == 'matching' ? 'golem-matching-restart' : scenario == 'cycle' ? 'golem-cycle-restart' : scenario == 'cocoa' ? 'golem-cocoa-restart' : scenario == 'farm' ? 'golem-farm-restart' : scenario == 'construction' ? 'golem-construction-restart' : scenario == 'logistics' ? 'golem-logistics-restart' : scenario == 'formation' ? 'golem-formation-restart' : scenario == 'press' ? 'golem-press-restart' : scenario == 'nbt' ? 'golem-nbt-restart' : scenario == 'leave' ? 'golem-leave-restart' : scenario == 'empty' ? 'golem-empty-restart' : scenario == 'area' ? 'golem-area-restart' : scenario == 'bell' ? 'golem-bell-restart' : scenario == 'controls' ? 'golem-controls-restart' : scenario == 'filter' ? 'golem-filter-restart' : (scenario == 'fill' ? 'golem-fill-restart' : 'golem-restart'))
                systemProperty 'thaumcraft.golemRestartPhase', project.findProperty('golemRestartPhase') ?: ''
                systemProperty 'thaumcraft.golemRestartScenario', scenario
            }
        }
    }
}
