# CircleCI alternative to GitHub-hosted Actions (blocked by account billing).
# CircleCI GitHub App project + push trigger must be enabled in CircleCI UI.
# Cheap connectivity/asset job on every push; actual Minecraft only when
# a pipeline is triggered with run_minecraft=true to preserve free credits.
version: 2.1

parameters:
  run_minecraft:
    type: boolean
    default: false
  run_package_server:
    type: boolean
    default: true
  # Expensive NeoForge compile runs on demand; cheap core parity stays on all pushes.
  run_compile:
    type: boolean
    default: false

jobs:
  verify-connection:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Validate Java and original source resources
          command: |
            java -version
            python3 --version
            bash -n tools/client_smoke.sh
            bash tools/test_minecraft_gui_coordinates.sh
            python3 tools/test_client_world_permissions.py
            python3 tools/verify_crystal_assets.py
            python3 tools/verify_source_item_models.py
            python3 tools/test_starter_item_localization.py
            python3 tools/verify_survival_loot_tables.py
            python3 tools/verify_tube_source_art.py
            python3 tools/verify_alumentum_fuel_source.py
            python3 tools/verify_alchemy_source_art.py
            bash tools/run_core_parity.sh
            echo "CIRCLECI_THAUMCRAFT_REPOSITORY_CHECK_OK"
  neoforge-compile:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Compile full NeoForge 1.21.1 Java and bundled resources
          no_output_timeout: 20m
          command: |
            # Preserve the *entire* setup and Gradle command transcript.
            # Prior #94/#103 failures could happen before the Gradle tee
            # and store_artifacts was not configured for failure.
            mkdir -p compile-audit
            exec > >(tee compile-audit/neoforge-compile.log) 2>&1
            set -euo pipefail
            echo "NEOFORGE_COMPILE_BEGIN=$(date -u +%FT%TZ)"
            java -version
            curl -fsSL --retry 3 --retry-all-errors \
              -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-9.2.1/bin/gradle --no-daemon --console=plain \
              --max-workers=2 --stacktrace compileJava processResources
            echo THAUMCRAFT_NEOFORGE_CLASSES_COMPILED_OK
      - store_artifacts:
          when: always
          path: compile-audit/neoforge-compile.log
          destination: neoforge/compile.log
  # Opt-in end-to-end packaging check, after java source compile succeeds.
  # Generates a distributable JAR and boots an actual dedicated server.
  neoforge-package-server:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build distributable NeoForge JAR
          no_output_timeout: 20m
          command: |
            mkdir -p server-audit
            exec > >(tee server-audit/build.log) 2>&1
            set -euo pipefail
            echo "JAR_BUILD_START=$(date -u +%FT%TZ)"
            java -version
            curl -fsSL --retry 3 --retry-all-errors \
              -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-9.2.1/bin/gradle --no-daemon --console=plain \
              --max-workers=2 build -x test
            test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
            for jar in build/libs/*.jar; do
              test -s "$jar"
              unzip -t "$jar" | tail -1
              sha256sum "$jar"
            done
            echo THAUMCRAFT_NEOFORGE_JAR_PACKAGED_OK
      - run:
          name: Launch real NeoForge dedicated server and assert READY
          no_output_timeout: 20m
          command: |
            set -Eeuo pipefail
            mkdir -p run server-audit
            echo 'eula=true' > run/eula.txt
            # CI probes never bind a public listener.
            cat > run/server.properties <<'PROPERTIES'
            online-mode=false
            server-ip=127.0.0.1
            server-port=25585
            max-players=1
            spawn-protection=0
            PROPERTIES
            export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
            setsid /tmp/gradle-9.2.1/bin/gradle --no-daemon --console=plain \
              --max-workers=2 runServer > server-audit/server.log 2>&1 &
            server_pid=$!
            cleanup() {
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            ready=0
            for attempt in $(seq 1 240); do
              if grep -Eiq 'Exception in server tick loop|Failed to start the minecraft server|Mod loading has failed|Crash report|Exception in thread "main"' server-audit/server.log; then
                echo SERVER_SMOKE_CRASH_DETECTED=YES
                break
              fi
              if grep -Fq 'Done (' server-audit/server.log; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                echo SERVER_SMOKE_EXITED_PREMATURELY=YES
                break
              fi
              if (( attempt % 15 == 0 )); then
                echo "SERVER_SMOKE_WAIT_SECONDS=$attempt"
                tail -6 server-audit/server.log || true
              fi
              sleep 1
            done
            tail -80 server-audit/server.log || true
            if [[ "$ready" -ne 1 ]]; then
              echo THAUMCRAFT_DEDICATED_SERVER_READY=NO
              exit 1
            fi
            grep -Fq 'NeoForge' server-audit/server.log || {
              echo 'NeoForge marker missing from server log'
              exit 1
            }
            echo THAUMCRAFT_DEDICATED_SERVER_READY=YES
      - store_artifacts:
          path: server-audit
          destination: server-audit
      - store_artifacts:
          path: build/libs
          destination: distributable-jars
  real-minecraft-client:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Java 21, Gradle 9.2.1 and virtual graphics
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              openjdk-21-jdk-headless unzip curl \
              xvfb x11-utils xdotool openbox mesa-utils \
              libgl1-mesa-dri libgl1 libxrender1 imagemagick ffmpeg
            sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
            curl -fsSL --retry 3 -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            echo 'export PATH=/opt/gradle-9.2.1/bin:$PATH' >> "$BASH_ENV"
            java -version
      - run:
          name: Play Minecraft 1.21.1 NeoForge and record real screenshots
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            export CAPTURE_VIDEO=0
            bash tools/client_smoke.sh
      - store_artifacts:
          path: client-smoke/screenshots
          destination: minecraft/screenshots
      - store_artifacts:
          path: client-smoke/client.log
          destination: minecraft/client.log
      - store_artifacts:
          path: client-smoke-status.txt
          destination: minecraft/status.txt
      - store_artifacts:
          path: client-smoke/renderer.txt
          destination: minecraft/renderer.txt
      - store_artifacts:
          path: run/logs/latest.log
          destination: minecraft/latest.log

workflows:
  connection-check:
    jobs:
      - verify-connection
  neoforge-java-validation:
    when: << pipeline.parameters.run_compile >>
    jobs:
      - neoforge-compile
  neoforge-jar-server-smoke:
    when: << pipeline.parameters.run_package_server >>
    jobs:
      - neoforge-package-server
  minecraft-visual-regression:
    when: << pipeline.parameters.run_minecraft >>
    jobs:
      - real-minecraft-client
