# CircleCI alternative to GitHub-hosted Actions (blocked by account billing).
# CircleCI GitHub App project + push trigger must be enabled in CircleCI UI.
# Cheap connectivity/asset job on every push; actual Minecraft only when
# a pipeline is triggered with run_minecraft=true to preserve free credits.
version: 2.1

parameters:
  run_minecraft:
    type: boolean
    default: false
  # Expensive NeoForge compile runs on demand; cheap core parity stays on all pushes.
  run_compile:
    type: boolean
    default: true

jobs:
  verify-connection:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Validate Java and original source resources
          command: |
            java -version
            python3 --version
            bash -n tools/client_smoke.sh
            bash tools/test_minecraft_gui_coordinates.sh
            python3 tools/test_client_world_permissions.py
            python3 tools/verify_crystal_assets.py
            python3 tools/verify_source_item_models.py
            python3 tools/test_starter_item_localization.py
            python3 tools/verify_survival_loot_tables.py
            python3 tools/verify_tube_source_art.py
            python3 tools/verify_alumentum_fuel_source.py
            python3 tools/verify_alchemy_source_art.py
            bash tools/run_core_parity.sh
            echo "CIRCLECI_THAUMCRAFT_REPOSITORY_CHECK_OK"
  neoforge-compile:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Compile full NeoForge 1.21.1 Java and bundled resources
          no_output_timeout: 20m
          command: |
            # Preserve the *entire* setup and Gradle command transcript.
            # Prior #94/#103 failures could happen before the Gradle tee
            # and store_artifacts was not configured for failure.
            mkdir -p compile-audit
            exec > >(tee compile-audit/neoforge-compile.log) 2>&1
            set -euo pipefail
            echo "NEOFORGE_COMPILE_BEGIN=$(date -u +%FT%TZ)"
            java -version
            curl -fsSL --retry 3 --retry-all-errors \
              -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-9.2.1/bin/gradle --no-daemon --console=plain \
              --max-workers=2 --stacktrace build -x test
            echo THAUMCRAFT_NEOFORGE_CLASSES_COMPILED_OK
            ls -lh build/libs/*.jar
            unzip -t build/libs/*.jar | tail -1
            echo THAUMCRAFT_NEOFORGE_JAR_PACKAGED_OK
            mkdir -p run
            echo 'eula=true' > run/eula.txt
            # Server smoke is bound to localhost on CI; no external players.
            printf 'server-ip=127.0.0.1\\nserver-port=25585\\nonline-mode=false\\n' > run/server.properties
            setsid /tmp/gradle-9.2.1/bin/gradle --no-daemon --console=plain \\
              --max-workers=2 runServer > compile-audit/server.log 2>&1 &
            spid=$!
            trap 'kill -TERM -- "-$spid" 2>/dev/null || true; wait "$spid" 2>/dev/null || true' EXIT
            ready=0
            for n in $(seq 1 210); do
              if grep -Eiq 'Exception in server tick loop|Failed to start the minecraft server|Mod loading has failed|Crash report|Exception in thread "main"' compile-audit/server.log; then
                echo 'REAL_SERVER_CRASH=YES'
                break
              fi
              if grep -Fq 'Done (' compile-audit/server.log; then
                ready=1
                break
              fi
              if ! kill -0 "$spid" 2>/dev/null; then
                echo 'REAL_SERVER_PROCESS_EXITED=YES'
                break
              fi
              if (( n % 15 == 0 )); then
                echo "REAL_SERVER_WAIT_SECONDS=$n"
                tail -4 compile-audit/server.log || true
              fi
              sleep 1
            done
            tail -90 compile-audit/server.log || true
            test "$ready" -eq 1
            echo THAUMCRAFT_DEDICATED_SERVER_READY=YES
      - store_artifacts:
          when: always
          path: compile-audit
          destination: neoforge
      - store_artifacts:
          path: build/libs
          destination: neoforge/jars
  real-minecraft-client:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Java 21, Gradle 9.2.1 and virtual graphics
          command: |
            set -euo pipefail
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              openjdk-21-jdk-headless unzip curl \
              xvfb x11-utils xdotool openbox mesa-utils \
              libgl1-mesa-dri libgl1 libxrender1 imagemagick ffmpeg
            sudo update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
            curl -fsSL --retry 3 -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-9.2.1-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            echo 'export PATH=/opt/gradle-9.2.1/bin:$PATH' >> "$BASH_ENV"
            java -version
      - run:
          name: Play Minecraft 1.21.1 NeoForge and record real screenshots
          no_output_timeout: 25m
          command: |
            set -euo pipefail
            export CAPTURE_VIDEO=0
            bash tools/client_smoke.sh
      - store_artifacts:
          path: client-smoke/screenshots
          destination: minecraft/screenshots
      - store_artifacts:
          path: client-smoke/client.log
          destination: minecraft/client.log
      - store_artifacts:
          path: client-smoke-status.txt
          destination: minecraft/status.txt
      - store_artifacts:
          path: client-smoke/renderer.txt
          destination: minecraft/renderer.txt
      - store_artifacts:
          path: run/logs/latest.log
          destination: minecraft/latest.log

workflows:
  connection-check:
    jobs:
      - verify-connection
  neoforge-java-validation:
    when: << pipeline.parameters.run_compile >>
    jobs:
      - neoforge-compile
  minecraft-visual-regression:
    when: << pipeline.parameters.run_minecraft >>
    jobs:
      - real-minecraft-client
