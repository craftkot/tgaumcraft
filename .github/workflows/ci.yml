name: Thaumcraft Port CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Core parity test
        shell: bash
        run: |
          OUT=build/core-test-classes
          rm -rf "$OUT"
          mkdir -p "$OUT"
          mapfile -t CORE_SOURCES < <(find src/main/java/dev/ehtid/thaumcraft/port/core -name '*.java' -print | sort)
          javac --release 21 -d "$OUT" "${CORE_SOURCES[@]}" src/test/java/dev/ehtid/thaumcraft/port/core/CoreParityTest.java src/test/java/dev/ehtid/thaumcraft/port/core/CrystalFarmerParityTest.java src/test/java/dev/ehtid/thaumcraft/port/core/CrystalGrowthParityTest.java src/test/java/dev/ehtid/thaumcraft/port/core/CrystalMeshParityTest.java src/test/java/dev/ehtid/thaumcraft/port/core/EssentiaJarParityTest.java src/test/java/dev/ehtid/thaumcraft/port/core/EssentiaSourceOrderParityTest.java
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.CoreParityTest | tee /tmp/core.txt
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.CrystalFarmerParityTest | tee /tmp/crystal-farmer.txt
          grep -q "Crystal farmer BETA26 parity: OK" /tmp/crystal-farmer.txt
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.CrystalGrowthParityTest | tee /tmp/crystal-growth.txt
          grep -q "Crystal growth BETA26 parity: OK" /tmp/crystal-growth.txt
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.CrystalMeshParityTest | tee /tmp/crystal-mesh.txt
          grep -q "CrystalModel seeded selection parity OK" /tmp/crystal-mesh.txt
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.EssentiaJarParityTest | tee /tmp/essentia-jar.txt
          grep -q "BETA26 jar parity: OK" /tmp/essentia-jar.txt
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.EssentiaSourceOrderParityTest | tee /tmp/essentia-order.txt
          grep -q "BETA26 essentia source search parity: OK" /tmp/essentia-order.txt

          grep -Eq 'Core parity tests: OK \(([4-9][0-9]{3}|[1-9][0-9]{4,}) assertions\)' /tmp/core.txt

      - name: Verify source BETA26 Arcane Workbench block and item models
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          root=Path('src/main/resources/assets/thaumcraft')
          states=json.loads((root/'blockstates/arcane_workbench.json').read_text())
          assert states['variants']=={'':{'model':'thaumcraft:block/arcane_workbench'}}
          model=json.loads((root/'models/block/arcane_workbench.json').read_text())
          assert model['ambientocclusion'] is False
          assert len(model['elements'])==6
          assert model['elements'][0]['from']==[0,8,0]
          assert model['elements'][0]['to']==[16,16,16]
          assert model['elements'][-1]['from']==[0,0,0]
          assert model['elements'][-1]['to']==[16,4,16]
          assert json.loads((root/'models/item/arcane_workbench.json').read_text())['parent']=='thaumcraft:block/arcane_workbench'
          expected={
            'arcane_workbench_side':'45f376e6b7f4317a855133df4f4b196f0ef053113ebbe534643f21684c115207',
            'arcane_workbench_top':'e4aa96a67d21b5a305911f0e81d8c196f1da1628411711157717199b012a9c17'
          }
          for name,digest in expected.items():
            content=(root/'textures/block'/ (name+'.png')).read_bytes()
            assert hashlib.sha256(content).hexdigest()==digest, name
          print('Original BETA26 Arcane Workbench model and textures: OK')
          PY

      - name: Check FIRSTSTEPS loader sources
        shell: bash
        run: |
          test -f src/neoforge/java/dev/ehtid/thaumcraft/ThaumcraftPort.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/item/CrystalEssenceItem.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/item/SalisMundusItem.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/network/FirstStepsProgressPayload.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/player/FirstStepsPlayerEvents.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftBlocks.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftItems.java
          test -f src/neoforge/java/dev/ehtid/thaumcraft/world/SalisMundusTransformQueue.java

      - name: Check BETA26 celestial note textures and models
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("src/main/resources/assets/thaumcraft")
          model_dir = root / "models/item"
          texture_dir = root / "textures/item"
          notes = json.loads((model_dir / "celestial_notes.json").read_text())
          expected = (["stars_" + str(n) for n in range(1, 5)]
                      + ["moon_" + str(n) for n in range(1, 9)])
          assert len(notes["overrides"]) == 12
          assert notes["textures"]["layer0"] == "thaumcraft:item/celestial/sheet"
          assert notes["textures"]["layer1"] == "thaumcraft:item/celestial/sun"
          for metadata, name in enumerate(expected, 1):
              override = notes["overrides"][metadata - 1]
              assert override["predicate"]["custom_model_data"] == metadata
              assert override["model"] == "thaumcraft:item/celestial_notes_" + name
              model = json.loads((model_dir / ("celestial_notes_" + name + ".json")).read_text())
              assert model["textures"]["layer0"] == notes["textures"]["layer0"]
              png = model["textures"]["layer1"].split(":", 1)[1].removeprefix("item/") + ".png"
              image = texture_dir / png
              assert image.is_file() and image.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))

          for name in ["sun", "sheet", *["stars" + str(i) for i in range(1, 5)],
                       *["moon" + str(i) for i in range(1, 9)]]:
              image = texture_dir / "celestial" / (name + ".png")
              assert image.is_file() and image.read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a"))
          assert (texture_dir / "scribing_tools.png").is_file()
          assert (model_dir / "scribing_tools.json").is_file()

          for language in ("en_us", "ru_ru"):
              data = json.loads((root / "lang" / (language + ".json")).read_text())
              for key in ("item.thaumcraft.scribing_tools", "item.thaumcraft.celestial_notes",
                          "tc.celestial.fail.1", "tc.celestial.fail.2"):
                  assert key in data, (language, key)
              for name in ("sun", *expected):
                  assert "item.celestial_notes." + name + ".text" in data
          for recipe_name in ("scribing_tools", "scribing_tools_refill"):
              recipe = json.loads((Path("src/main/resources/data/thaumcraft/recipe") /
                                   (recipe_name + ".json")).read_text())
              assert recipe["result"]["id"] == "thaumcraft:scribing_tools"
          print("Celestial art, 13 variants, two languages and two recipes: OK")
          PY

      - name: Verify original wooden and research table gameplay assets
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          assets = Path("src/main/resources/assets/thaumcraft")
          expected_hashes = {
              "block/base_wood_grain.png": "73cad612c749788c8bf892b3e9f771e1447fa1ccd756fb4a458a6fbb0e30c21d",
              "block/research_table_front.png": "dcde776d7a8d16997fa5b5e2977c342f8e373007d4486a39a4599fd531c6c43d",
              "block/research_table_side.png": "819025366e210a6e77cb22567073d329c6ed79c70f293188c514eb19aa348f3f",
              "block/research_table_top.png": "eb863b414aef5562e81cc0c973e1cb8a8b2b19c957ede5bb2c6dc777b5d2adc4",
              "block/research_table_model.png": "9cb849fa40792c254b10f69a183896a7047050659694d024772dac4073f0b3d0",
              "block/table_wood_side.png": "986766e91e793db6f5d16ab18b256b98a699685d0f053be24ae6b843240e177e",
              "block/table_wood_top.png": "ed844268fecc31c27691e6bf173855b3522fe816fe7451a8bbfdc1aa9425d2bf",
              "gui/gui_research_table.png": "aa51f1474d7cb5f8dc774ff150c5c067b4ad0535f8fb120b44728be4120bb6ad",
              "gui/gui_base.png": "bd227296741c97bcf280778b742f8e2b07227aeacc381335036d4939e77f2913"
          }
          for path, expected in expected_hashes.items():
              actual = hashlib.sha256((assets / "textures" / path).read_bytes()).hexdigest()
              assert actual == expected, (path, actual)

          for name in ("table_wood", "research_table"):
              model = json.loads((assets / "models/block" / (name + ".json")).read_text())
              assert len(model["elements"]) == (6 if name == "table_wood" else 5)
              for texture in model["textures"].values():
                  ref = texture.split(":", 1)[1]
                  assert ref.startswith("block/"), texture
                  assert (assets / "textures" / (ref + ".png")).exists(), texture
              item_model = json.loads((assets / "models/item" / (name + ".json")).read_text())
              assert item_model["parent"] == "thaumcraft:block/" + name
              state = json.loads((assets / "blockstates" / (name + ".json")).read_text())
              assert state["variants"]

              drops = json.loads((Path("src/main/resources/data/thaumcraft/loot_table/blocks") /
                                 (name + ".json")).read_text())
              assert drops["pools"][0]["entries"][0]["name"] == "thaumcraft:" + name

          directions = json.loads((assets / "blockstates/research_table.json").read_text())["variants"]
          assert set(directions) == {"facing=north", "facing=south", "facing=east", "facing=west"}

          recipe = json.loads((Path("src/main/resources/data/thaumcraft/recipe/table_wood.json")).read_text())
          assert recipe["type"] == "minecraft:crafting_shaped"
          assert recipe["category"] == "building" # Valid 1.21 CraftingBookCategory
          assert recipe["pattern"] == ["SSS", "W W"]
          assert recipe["key"]["S"]["tag"] == "minecraft:wooden_slabs"
          assert recipe["key"]["W"]["tag"] == "minecraft:planks"
          assert recipe["result"]["id"] == "thaumcraft:table_wood"

          for language in ("en_us", "ru_ru"):
              entries = json.loads((assets / "lang" / (language + ".json")).read_text())
              for key in ("block.thaumcraft.table_wood", "block.thaumcraft.research_table",
                          "container.thaumcraft.research_table",
                          "research_table.awaiting_theory", "research_table.inspiration",
                          "button.create.theory", "button.complete.theory",
                          "button.scrap.theory"):
                  assert key in entries, (language, key)
          original_cards = (
              "study reject experimentation analyze rethink ponder notation balance "
              "curio inspired enchantment beacon celestial concentrate reactions "
              "synthesis measure channel infuse calibrate mindmatter tinker "
              "spellbinding awareness focus sculpting scripting synergy "
              "darkwhisper glyph portal revelation realization"
          ).split()
          assert len(original_cards) == 33 and len(set(original_cards)) == 33
          for language in ("en_us", "ru_ru"):
              entries = json.loads((assets / "lang" / (language + ".json")).read_text())
              for short in original_cards:
                  assert "card." + short + ".name" in entries, (language, short)
              # BETA26 preserves the actual study/reject/analyze category
              # and channel aspect names; translated names must be present
              # or the client prints untranslated keys on selected cards.
              categories = ["BASICS", "AUROMANCY", "ALCHEMY", "ARTIFICE",
                            "INFUSION", "GOLEMANCY", "ELDRITCH"]
              aspects = ("aer terra ignis aqua ordo perditio vacuos lux motus "
                         "gelum vitreus metallum victus mortuus potentia "
                         "permutatio praecantatio auram alkimia vitium "
                         "tenebrae alienis volatus herba instrumentum "
                         "fabrico machina vinculum spiritus cognitio "
                         "sensus aversio praemunio desiderium exanimis "
                         "bestia humanus").split()
              assert len(aspects) == 37
              for category in categories:
                  assert entries.get("tc.research_category." + category), (language, category)
              for aspect in aspects:
                  assert entries.get("tc.aspect." + aspect), (language, aspect)
              for key in ("button.keep.theory", "research_table.card_preview",
                          "research_table.card_preview_tooltip",
                          "research_table.unknown_card", "research_table.aids"):
                  assert key in entries, (language, key)

          # ItemPhial.makeFilledPhial(aspect) preserves the original capacity
          # and 0=empty / 1=filled visual variants. Check real PNG bytes and
          # model override rather than trusting an absent texture reference.
          phial = json.loads((assets / "models/item/phial.json").read_text())
          filled = json.loads((assets / "models/item/phial_filled.json").read_text())
          assert phial["textures"]["layer0"] == "thaumcraft:item/phial"
          assert phial["overrides"][0]["predicate"]["custom_model_data"] == 1
          assert phial["overrides"][0]["model"] == "thaumcraft:item/phial_filled"
          assert filled["textures"]["layer0"] == "thaumcraft:item/phial"
          assert filled["textures"]["layer1"] == "thaumcraft:item/phial_overlay"
          for name in ("phial", "phial_overlay"):
              data = (assets / "textures/item" / (name + ".png")).read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10]), name
              assert len(data) > 100, name
          for language in ("en_us", "ru_ru"):
              entries = json.loads((assets / "lang" / (language + ".json")).read_text())
              assert entries.get("item.phial.empty.name"), language
              assert "%s" in entries.get("item.phial.filled.name", ""), language

          # Seven original BETA26 Curio metadata variants include the
          # Crimson Rites (metadata 6), which uses its own 32x32 original
          # texture. Don't silently alias missing variants to Arcane.
          variants = ["arcane", "preserved", "ancient", "eldritch",
                      "knowledge", "twisted", "rites"]
          model = json.loads((assets / "models/item/curio.json").read_text())
          assert model["textures"]["layer0"] == "thaumcraft:item/curio_arcane"
          assert len(model["overrides"]) == 6
          for meta, variant in enumerate(variants):
              item_texture = "crimson_rites" if variant == "rites" else "curio_" + variant
              data = (assets / "textures/item" / (item_texture + ".png")).read_bytes()
              assert data[:8] == bytes([137,80,78,71,13,10,26,10]), variant
              assert len(data) > 100, variant
              if meta != 0:
                  entry = model["overrides"][meta - 1]
                  assert entry["predicate"]["custom_model_data"] == meta
                  assert entry["model"] == "thaumcraft:item/curio_" + variant
                  variant_model = json.loads((assets / "models/item" /
                                              ("curio_" + variant + ".json")).read_text())
                  assert variant_model["textures"]["layer0"] == (
                      "thaumcraft:item/" + item_texture)
          for lang in ("en_us", "ru_ru"):
              entries = json.loads((assets / "lang" / (lang + ".json")).read_text())
              for variant in variants:
                  assert entries.get("item.curio." + variant + ".name"), (lang, variant)
              for key in ("item.curio.text", "tc.knowledge.gained",
                          "fail.crimsonrites"):
                  assert entries.get(key), (lang, key)

          # BETA26 ConfigRecipes: eight metadata-0 phials from
          # original shaped " C" / "G G" / " G", C=clay ball,
          # G=blockGlass OreDictionary (plain + all 16 stained colors).
          phial_recipe = json.loads((Path("src/main/resources/data/thaumcraft/recipe/phial.json")).read_text())
          assert phial_recipe["type"] == "minecraft:crafting_shaped"
          assert phial_recipe["pattern"] == [" C ", "G G", " G "]
          assert phial_recipe["key"]["C"]["item"] == "minecraft:clay_ball"
          assert phial_recipe["key"]["G"]["tag"] == "thaumcraft:phial_glass"
          assert phial_recipe["result"] == {"id": "thaumcraft:phial", "count": 8}
          glass_tag = json.loads((Path("src/main/resources/data/thaumcraft/tags/item/phial_glass.json")).read_text())
          colors = ("white orange magenta light_blue yellow lime pink gray light_gray "
                    "cyan purple blue brown green red black").split()
          expected_glass = {"minecraft:glass"} | {
              "minecraft:" + color + "_stained_glass" for color in colors}
          assert set(value for value in glass_tag["values"] if isinstance(value, str)) == expected_glass
          assert {"id":"#c:glass_blocks","required":False} in glass_tag["values"]
          # Readable original creative group title and all true registered
          # Curio/Celestial/Phial variants are now available for client tests.
          for language in ("en_us", "ru_ru"):
              entries = json.loads((assets / "lang" / (language + ".json")).read_text())
              assert entries["itemGroup.thaumcraft"] == "Thaumcraft"

          # At the 80% milestone keep visual assets ORIGINAL, not
          # missing purple checkerboards in the restored creative tab.
          for item in ("thaumonomicon", "crystal_essence"):
              png = (assets / "textures/item" / (item + ".png")).read_bytes()
              assert png[:8] == bytes([137,80,78,71,13,10,26,10]), item
              assert len(png) > 300, item
              model = json.loads((assets / "models/item" / (item + ".json")).read_text())
              assert model["parent"] == "minecraft:item/generated", item
              assert model["textures"]["layer0"] == "thaumcraft:item/" + item

          # The BETA26 original card factory must preserve 33 registered
          # subclasses and all 14 custom serialized NBT initializers, and
          # must never enable paper-consuming GUI draws before every card
          # can be activated with correct original effects.
          import re
          initializer = Path("src/neoforge/java/dev/ehtid/thaumcraft/scanning/NeoForgeTheorycraftCardInitializer.java").read_text()
          factory_cases = initializer.split("switch (name) {", 1)[1].split("default ->", 1)[0]
          actual_fields = set(re.findall(r'"(Card[A-Za-z]+)"', factory_cases))
          expected_fields = set((
              "CardStudy CardAnalyze CardReject CardInspired CardNotation "
              "CardCurio CardCelestial CardConcentrate CardChannel "
              "CardReactions CardSynthesis CardMindOverMatter CardTinker "
              "CardInfuse"
          ).split())
          assert actual_fields == expected_fields, (actual_fields, expected_fields)
          fieldless = Path("src/main/java/dev/ehtid/thaumcraft/port/core/LegacyTheorycraftFieldlessInit.java").read_text()
          assert fieldless.count('case "Card') >= 6
          draw = Path("src/neoforge/java/dev/ehtid/thaumcraft/scanning/NeoForgeTheorycraftDrawBridge.java").read_text()
          assert "cardsInHashMapIterationOrder()" in draw
          assert "rng.nextLong()" in draw
          assert "NeoForgeTheorycraftCardInitializer.initialize(" in draw
          table = Path("src/neoforge/java/dev/ehtid/thaumcraft/blockentity/ResearchTableBlockEntity.java").read_text()
          assert "drawOriginalTheoryCards(" in table
          menu = Path("src/neoforge/java/dev/ehtid/thaumcraft/menu/ResearchTableMenu.java").read_text()
          # Original buttons are NOW wired to a server-only atomic commit.
          # Require both directions: activation never debits from client UI,
          # and the server never accepts a failed material/ink/XP preflight.
          assert "drawOriginalTheoryCards(serverPlayer, buttonId)" in menu
          assert "activateOriginalTheoryCard(serverPlayer, buttonId - 4)" in menu
          assert "researchTable.session().bonusDraws() <= 0 && buttonId == 3" in menu
          screen = Path("src/neoforge/java/dev/ehtid/thaumcraft/client/ResearchTableScreen.java").read_text()
          assert "menu.containerId, i + 4" in screen
          assert "menu.bonusDraws() > 0 ? 3 : 2" in screen
          for language in ("en_us", "ru_ru"):
              entries = json.loads((assets / "lang" / (language + ".json")).read_text())
              assert entries.get("research_table.draw_cards"), language
          assert "pendingChoices().isEmpty()" in table
          assert "stageAfterValidatedCosts(player, this, index, preflight)" in table
          assert "NeoForgeTheorycraftItemTransaction" in table
          assert ".commit(player, required.required(), required.consumed())" in table
          assert "spendTableSupplies(checked.costs().inkUnits()" in table
          assert "knowledge.loadSnapshot(" in table
          assert "LegacyTheorycraftChoiceNbt.writeChoices(originalSessionNbt, selected)" in table

          # Every BETA26 registered theory card now has one exact effect
          # dispatch branch. This effect is staged on COPIES: an activation
          # cannot mutate real knowledge, warp or theory before item/XP
          # preflight, which also budgets two inks for CardScripting.
          manifest = Path("src/main/java/dev/ehtid/thaumcraft/port/core/LegacyTheorycraftManifest.java").read_text()
          registered = manifest.split("CARD_REGISTRATION_ORDER = List.of(",1)[1].split(");",1)[0]
          registered_names = set(re.findall(r'\.Card([A-Za-z]+)"', registered))
          effects = Path("src/main/java/dev/ehtid/thaumcraft/port/core/LegacyTheorycraftActivationEffects.java").read_text()
          case_block = effects.split("switch (card.key().substring(",1)[1].split("default ->",1)[0]
          effects_names = set(re.findall(r'case "Card([A-Za-z]+)"', case_block))
          # Several switch arms group two separate class names.
          effects_names |= set(re.findall(r', "Card([A-Za-z]+)"', case_block))
          assert len(registered_names) == 33 and effects_names == registered_names, (registered_names - effects_names, effects_names - registered_names)
          assert "LegacyResearchTableData.fromSnapshot(originalTable.snapshot())" in effects
          costs = Path("src/main/java/dev/ehtid/thaumcraft/port/core/LegacyTheorycraftActivationPreflight.java").read_text()
          assert "int ink = scripting ? 2 : 1" in costs
          assert "int paper = scripting ? 1 : 0" in costs
          assert "LegacyTheorycraftRequiredItems.requiredItemCount(key)" in costs
          adapter = Path("src/neoforge/java/dev/ehtid/thaumcraft/scanning/NeoForgeTheorycraftActivationPreflight.java").read_text()
          assert "prepareOriginalChoice(" in adapter
          assert "table.stillValid(player)" in adapter

          print("Original BETA26 Research Table art, wooden crafting, facing states, loot and translations: OK")
          PY

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify original BETA26 infusion pedestal assets
        shell: bash
        run: python3 tools/verify_pedestal_assets.py

      - name: Verify infusion pillar/matrix registration and states
        shell: bash
        run: python3 tools/verify_infusion_structure.py

      - name: Verify source-era Crystal Farmer recipe runtime adapter
        shell: bash
        run: |
          test -f src/neoforge/java/dev/ehtid/thaumcraft/crafting/CrystalFarmerInfusionAdapter.java
          grep -q 'prepareInfusionStartFromWorld' src/neoforge/java/dev/ehtid/thaumcraft/crafting/CrystalFarmerInfusionAdapter.java
          grep -q 'CrystalEssenceItem.legacyAspect' src/neoforge/java/dev/ehtid/thaumcraft/crafting/CrystalFarmerInfusionAdapter.java

      - name: Verify original BlockCrystal registrations, textures and drops
        shell: bash
        run: python3 tools/verify_crystal_assets.py

      - name: Verify original scanner and Salis Mundus resources
        run: python3 tools/verify_source_item_models.py

      - name: Verify resource-backed infusion jar bridge
        shell: bash
        run: |
          grep -q 'LegacyEssentiaSourceOrder.nullFacing(range)' src/neoforge/java/dev/ehtid/thaumcraft/crafting/InfusionJarSourceBridge.java
          grep -q 'jar.takeForInfusion(aspect, 1)' src/neoforge/java/dev/ehtid/thaumcraft/crafting/InfusionJarSourceBridge.java
          grep -q 'jar.blocked()' src/neoforge/java/dev/ehtid/thaumcraft/crafting/InfusionJarSourceBridge.java
          grep -q 'level.hasChunkAt' src/neoforge/java/dev/ehtid/thaumcraft/crafting/InfusionJarSourceBridge.java
          grep -q 'LegacyInfusionEssentiaCycle.cycle' src/neoforge/java/dev/ehtid/thaumcraft/blockentity/InfusionMatrixBlockEntity.java

      - name: NeoForge build
        run: gradle build -x test --stacktrace --no-daemon

      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt

          gradle runServer --no-daemon > server-smoke.log 2>&1 &
          server_pid=$!
          ready=0

          for _ in $(seq 1 90); do
            if grep -Eiq "Exception in server tick loop|Failed to start the minecraft server|Mod loading has failed|Crash report" server-smoke.log; then
              break
            fi
            if grep -Eq 'Done \([^)]*\)!' server-smoke.log; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          cat server-smoke.log

          if grep -Eiq "Exception in server tick loop|Failed to start the minecraft server|Mod loading has failed|Crash report" server-smoke.log; then
            exit 1
          fi
          if [ "$ready" -ne 1 ]; then
            echo "Dedicated server never reached ready state"
            exit 1
          fi

      - name: Upload built jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thaumcraft-port-jars
          path: build/libs/*.jar
          if-no-files-found: error
