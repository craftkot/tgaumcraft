name: Import exact BETA26 Wisp node atlas

on:
  push:
    branches:
      - feature/closure-near-complete
    paths:
      - '.github/workflows/closure-auranodes-import.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/closure-auranodes-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Fetch and verify the pinned BETA26 source asset
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "$branch" = 'feature/closure-near-complete'
          target='src/main/resources/assets/thaumcraft/textures/misc/auranodes.png'
          mkdir -p "$(dirname "$target")"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            'https://raw.githubusercontent.com/TheDarkTower314/Thaumcraft-6-Source-Code/954022bb777b7546281fb36df8522f0ba6b43f81/src/main/resources/assets/thaumcraft/textures/misc/auranodes.png' \
            --output "$target"

          blob="$(git hash-object "$target")"
          sha256="$(sha256sum "$target" | cut -d' ' -f1)"
          test "$blob" = '411d52fefb272574dfbb0466e3437e377e2cb907'
          test "$sha256" = '3b46124e4a48422bbb64d7948707c3d4422e9399970b7637e255726e5156bda4'

          python3 - "$target" <<'PY'
          import pathlib, struct, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          width, height = struct.unpack(">II", data[16:24])
          bit_depth, color_type = data[24], data[25]
          assert (width, height, bit_depth, color_type) == (2048, 2048, 8, 6), (
              width, height, bit_depth, color_type
          )
          print(f"BETA26 auranodes.png verified: {width}x{height} RGBA")
          PY

          git add -- "$target"
          if git diff --cached --quiet -- "$target"; then
            echo 'BETA26 auranodes.png already matches the pinned source'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: restore original BETA26 Wisp node atlas'
          git push origin "HEAD:$branch"
