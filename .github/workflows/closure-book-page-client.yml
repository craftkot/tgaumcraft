name: M16 real Minecraft Thaumonomicon page sound smoke

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/ThaumonomiconItem.java'
      - 'tools/client_book_page_sound_smoke.py'
      - 'tools/check_page_audio_pcm.py'
      - '.github/workflows/closure-book-page-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/ThaumonomiconItem.java'
      - 'tools/client_book_page_sound_smoke.py'
      - 'tools/check_page_audio_pcm.py'
      - '.github/workflows/closure-book-page-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-page-sound-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual graphics and input tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11-utils xdotool openbox mesa-utils \
            libgl1-mesa-dri libgl1 libxrender1 imagemagick ffmpeg \
            pulseaudio pulseaudio-utils
      - name: Generate isolated real-client script and validate Bash
        run: |
          python3 tools/client_book_page_sound_smoke.py > client-page-smoke-generated.sh
          bash -n client-page-smoke-generated.sh
      - name: Start virtual PulseAudio sink and test real client PCM
        run: |
          export XDG_RUNTIME_DIR=/tmp/thaumcraft-client-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tc_page_sink rate=48000 channels=2
          pactl set-default-sink tc_page_sink
          pactl info
          pactl list short sinks
          bash client-page-smoke-generated.sh
      - name: Upload real game screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-real-thaumonomicon-page-sound-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            client-smoke-status.txt
            client-smoke/
            run/logs/
            run/crash-reports/
