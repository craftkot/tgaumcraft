name: M16 real two-client Salis routing and chunk lifecycle

on:
  push:
    branches:
      - feature/closure-near-complete
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisTwoClientServerProbe.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/SalisTwoClientPacketProbe.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisSparkleChunkUnloadProbe.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisSparkleTrailQueue.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisMundusItem.java'
      - 'tools/client_salis_two_client_smoke.py'
      - 'tools/test_salis_two_client_probe.py'
      - '.github/workflows/closure-salis-two-client.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisTwoClientServerProbe.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/SalisTwoClientPacketProbe.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisSparkleChunkUnloadProbe.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisSparkleTrailQueue.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/SalisMundusItem.java'
      - 'tools/client_salis_two_client_smoke.py'
      - 'tools/test_salis_two_client_probe.py'
      - '.github/workflows/closure-salis-two-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salis-two-real-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install two-display real-client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11-utils xdotool openbox mesa-utils imagemagick \
            libgl1-mesa-dri libgl1 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxinerama1 libxcursor1 libxext6 flite1-dev

      - name: Verify Minecraft narrator native library
        run: |
          python3 - <<'PY'
          import ctypes
          ctypes.CDLL("libflite.so")
          print("MINECRAFT_NARRATOR_FLITE=PASS")
          PY

      - name: Verify Python and two-client contract
        run: |
          python3 -m py_compile \
            tools/client_salis_two_client_smoke.py \
            tools/test_salis_two_client_probe.py
          python3 tools/test_salis_two_client_probe.py

      - name: Run one dedicated server and two independent Minecraft clients
        env:
          THAUMCRAFT_SMOKE: '1'
          JAVA_TOOL_OPTIONS: '-Dthaumcraft.salisChunkUnloadScenario=true -Dthaumcraft.salisTwoClientScenario=true'
        run: python3 tools/client_salis_two_client_smoke.py

      - name: Upload both client logs, screenshots and dedicated-server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salis-two-real-clients-${{ github.sha }}
          path: |
            client-salis-two-client/
            run/server/logs/
            run/salis-two-client-actor/logs/
            run/salis-two-client-observer/logs/
            run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
