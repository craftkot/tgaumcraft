name: Integration acceptance gate unit tests

on:
  push:
    branches:
      - integration/verified-port-2026-11-14
  pull_request:
    branches:
      - integration/verified-port-2026-11-14
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python version
        run: python3 --version
      - name: Run evidence gate regression suite
        run: python3 -m unittest -v tools/test_integration_acceptance_gate.py
      - name: Confirm gate fails closed without evidence
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/integration_acceptance_gate.py analysis/evidence/integration/acceptance.json "${GITHUB_SHA}"; then
            echo "::error::Integration gate accepted missing or unverified evidence"
            exit 1
          fi
          echo "Fail-closed gate rejected unverified integration evidence as expected."
