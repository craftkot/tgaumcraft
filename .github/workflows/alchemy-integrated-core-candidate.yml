name: Alchemy integrated mirror core candidate

on:
  push:
    branches:
      - integration/alchemy-core-candidate-2026-11-16
  pull_request:
    branches:
      - integration/verified-port-2026-11-14
  workflow_dispatch:

jobs:
  mirror-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run integrated candidate mirror parity regression
        shell: bash
        run: |
          set -euo pipefail
          echo "Candidate SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          OUT=build/alchemy-integrated-mirror-core
          mkdir -p "$OUT"
          mapfile -t SOURCES < <(find src/main/java/dev/ehtid/thaumcraft/port/core -name '*.java' -print | sort)
          javac --release 21 -d "$OUT" "${SOURCES[@]}" src/test/java/dev/ehtid/thaumcraft/port/core/LegacyEssentiaMirrorLogicTest.java
          java -cp "$OUT" dev.ehtid.thaumcraft.port.core.LegacyEssentiaMirrorLogicTest | tee /tmp/mirror-parity.txt
          grep -q 'BETA26 essentia mirror link and instability parity: OK' /tmp/mirror-parity.txt
