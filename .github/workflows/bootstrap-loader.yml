name: Import loader layer
permissions:
  contents: write
on:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap-loader/**'
      - '.github/workflows/bootstrap-loader.yml'
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand loader layer
        run: |
          unzip -t bootstrap-loader/loader.zip || [ $? -eq 1 ]
          unzip -oq bootstrap-loader/loader.zip -d .
          rm -rf bootstrap-loader
          rm -f .github/workflows/bootstrap-loader.yml
      - name: Commit loader sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import NeoForge loader layer and test script"
          git push
