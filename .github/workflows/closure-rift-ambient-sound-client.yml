name: M16 real Minecraft BETA26 Flux Rift ambient sound

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/entity/FluxRiftEntity.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/entity/FluxRiftSoundGameTests.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/FluxRiftRenderer.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/FluxRiftClientEvents.java'
      - 'src/main/resources/assets/thaumcraft/shaders/core/flux_rift.json'
      - 'src/main/resources/assets/thaumcraft/shaders/core/flux_rift.vsh'
      - 'src/main/resources/assets/thaumcraft/shaders/core/flux_rift.fsh'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftSounds.java'
      - 'src/main/resources/assets/thaumcraft/sounds.json'
      - 'src/main/resources/assets/thaumcraft/sounds/evilportal.ogg'
      - 'tools/*rift*'
      - '.github/workflows/closure-rift-ambient-sound-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/entity/FluxRiftEntity.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/entity/FluxRiftSoundGameTests.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/FluxRiftRenderer.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/FluxRiftClientEvents.java'
      - 'src/main/resources/assets/thaumcraft/shaders/core/flux_rift.json'
      - 'src/main/resources/assets/thaumcraft/shaders/core/flux_rift.vsh'
      - 'src/main/resources/assets/thaumcraft/shaders/core/flux_rift.fsh'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftSounds.java'
      - 'src/main/resources/assets/thaumcraft/sounds.json'
      - 'src/main/resources/assets/thaumcraft/sounds/evilportal.ogg'
      - 'tools/*rift*'
      - '.github/workflows/closure-rift-ambient-sound-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flux-rift-ambient-sound:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Minecraft client and audio tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb x11-utils xdotool openbox mesa-utils \
            libgl1-mesa-dri libgl1 libxrender1 imagemagick ffmpeg \
            pulseaudio pulseaudio-utils
      - name: Verify original BETA26 asset and generated client driver
        run: |
          python -m pip install numpy==2.2.6 pillow==11.3.0
          python tools/verify_rift_ambient_sound.py
          python tools/client_rift_ambient_sound_smoke.py > client-rift-generated.sh
          bash -n client-rift-generated.sh
      - name: Launch actual Minecraft client and record Flux Rift ambience
        run: |
          export XDG_RUNTIME_DIR=/tmp/thaumcraft-rift-client-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Start the local daemon without a client override; setting PULSE_SERVER
          # before startup makes pulseaudio --start refuse to autospawn that server.
          unset PULSE_SERVER
          pulseaudio --start --exit-idle-time=-1
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          for attempt in {1..20}; do
            if pactl info >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          pactl info >/dev/null
          pactl load-module module-null-sink sink_name=tc_rift_sink rate=48000 channels=2
          pactl set-default-sink tc_rift_sink
          test "$(pactl get-default-sink)" = "tc_rift_sink"
          export PULSE_SINK=tc_rift_sink
          bash client-rift-generated.sh
      - name: Upload actual client PCM, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-flux-rift-ambient-sound-real-client
          retention-days: 14
          if-no-files-found: warn
          path: |
            client-smoke-status.txt
            client-smoke/
            run/logs/
            run/crash-reports/
