name: M16 Thaumonomicon original page sound

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/ThaumonomiconItem.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftSounds.java'
      - 'src/main/resources/assets/thaumcraft/sounds.json'
      - 'src/main/resources/assets/thaumcraft/sounds/page*.ogg'
      - 'tools/test_thaumonomicon_page_sound.py'
      - '.github/workflows/closure-book-page-sound.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/ThaumonomiconItem.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftSounds.java'
      - 'src/main/resources/assets/thaumcraft/sounds.json'
      - 'src/main/resources/assets/thaumcraft/sounds/page*.ogg'
      - 'tools/test_thaumonomicon_page_sound.py'
      - '.github/workflows/closure-book-page-sound.yml'
  workflow_dispatch:

jobs:
  original-page-sound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile real Thaumonomicon item with client/server stubs and verify original OGG
        run: python3 tools/test_thaumonomicon_page_sound.py
