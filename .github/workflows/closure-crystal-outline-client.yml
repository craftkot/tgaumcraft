name: M16 real Minecraft crystal outline block picking

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'tools/client_crystal_outline_smoke.py'
      - 'tools/test_crystal_outline_smoke.py'
      - 'tools/client_smoke.sh'
      - '.github/workflows/closure-crystal-outline-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/client_crystal_outline_smoke.py'
      - 'tools/test_crystal_outline_smoke.py'
      - 'tools/client_smoke.sh'
      - '.github/workflows/closure-crystal-outline-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crystal-outline-real-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real client and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11-utils xdotool openbox mesa-utils \
            libgl1-mesa-dri libgl1 libxrender1 imagemagick
      - name: Verify smoke contract and generated shell
        run: |
          python3 tools/test_crystal_outline_smoke.py
          python3 tools/client_crystal_outline_smoke.py > client-crystal-outline-generated.sh
          bash -n client-crystal-outline-generated.sh
      - name: Build NeoForge and launch actual Minecraft client
        run: |
          gradle build -x test --stacktrace --no-daemon
          bash client-crystal-outline-generated.sh
      - name: Upload actual client screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-crystal-outline-real-client-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            client-smoke-status.txt
            client-smoke/
            run/logs/
            run/crash-reports/
            build/libs/*.jar
