name: M16 real Minecraft pedestal item rotation

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/PedestalItemRenderer.java'
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/visual/LegacyPedestalRotationAngle.java'
      - 'tools/client_pedestal_rotation_smoke.py'
      - 'tools/test_pedestal_rotation_smoke.py'
      - 'tools/client_smoke.sh'
      - '.github/workflows/closure-pedestal-rotation-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/PedestalItemRenderer.java'
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/visual/LegacyPedestalRotationAngle.java'
      - 'tools/client_pedestal_rotation_smoke.py'
      - 'tools/test_pedestal_rotation_smoke.py'
      - 'tools/client_smoke.sh'
      - '.github/workflows/closure-pedestal-rotation-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pedestal-rotation-real-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install virtual graphics and input tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11-utils xdotool openbox mesa-utils \
            libgl1-mesa-dri libgl1 libxrender1 imagemagick
      - name: Validate source contract and generated client script
        run: python3 tools/test_pedestal_rotation_smoke.py
      - name: Launch actual Minecraft 1.21.1 client and measure pedestal rotation
        env:
          JAVA_TOOL_OPTIONS: -Dthaumcraft.pedestalRotationDebug=true
        run: |
          python3 tools/client_pedestal_rotation_smoke.py > client-pedestal-rotation-generated.sh
          bash -n client-pedestal-rotation-generated.sh
          bash client-pedestal-rotation-generated.sh
      - name: Upload actual screenshots, logs and JAR even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-pedestal-real-client-rotation
          retention-days: 14
          if-no-files-found: warn
          path: |
            client-smoke-status.txt
            client-smoke/
            run/logs/
            run/crash-reports/
            build/libs/*.jar
