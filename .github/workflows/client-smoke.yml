name: Thaumcraft Real Client Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/client-smoke.yml'
      - 'tools/client_smoke.sh'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/CrucibleFluidRenderer.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/ThaumcraftClientEvents.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/SeededCrystalBakedModel.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/CrystalModelEvents.java'
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/LegacyCrystalMeshSelection.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/blockentity/CrucibleBlockEntity.java'
      - 'src/main/resources/assets/thaumcraft/models/item/crucible.json'
      - 'src/main/resources/assets/thaumcraft/models/block/arcane_workbench.json'
      - 'src/main/resources/assets/thaumcraft/models/item/arcane_workbench.json'
      - 'src/main/resources/assets/thaumcraft/models/item/thaumometer.json'
      - 'src/main/resources/assets/thaumcraft/models/item/salis_mundus.json'
      - 'src/main/resources/assets/thaumcraft/models/item/scanner*'
      - 'src/main/resources/assets/thaumcraft/textures/item/scanner*'
      - 'src/main/resources/assets/thaumcraft/textures/item/scanscreen*'
      - 'src/main/resources/assets/thaumcraft/textures/item/salis_mundus*'
      - 'src/main/resources/assets/thaumcraft/blockstates/arcane_workbench.json'
      - 'src/main/resources/assets/thaumcraft/textures/block/arcane_workbench_*'
      # Real projectile code/registration must also trigger genuine client testing.
      - 'src/neoforge/java/dev/ehtid/thaumcraft/entity/AlumentumProjectile.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/AlumentumItem.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/registry/ThaumcraftEntities.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/block/CrystalClusterBlock.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/world/ThaumcraftAuraSavedData.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/world/ThaumcraftAuraWorldEvents.java'
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/LegacyModernBiomeCompatibility.java'
      - 'src/main/resources/assets/thaumcraft/models/block/crystal_*'
      - 'src/main/resources/assets/thaumcraft/blockstates/crystal_*'
      - 'src/main/resources/assets/thaumcraft/textures/block/crystal.png'
      # Any FIRSTSTEPS/Thaumometer path change requires actual in-world
      # mouse-click scan regression, not only the loader-neutral core CI.
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/GenericScanKeyLogic.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/scanning/ThaumometerScanDispatcher.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/scanning/ThaumometerTargeting.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/ThaumometerItem.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/player/FirstStepsPlayerEvents.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/block/InfusionMatrixBlock.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/item/BasicCasterItem.java'
      - 'src/main/resources/assets/thaumcraft/models/item/caster_*'
      - 'src/main/resources/assets/thaumcraft/textures/entity/armor/caster_basic.png'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/blockentity/InfusionMatrixBlockEntity.java'
      - 'src/main/resources/assets/thaumcraft/models/block/jar_normal.json'
      - 'src/main/resources/assets/thaumcraft/textures/block/jar_*'
      - 'src/main/resources/assets/thaumcraft/models/item/jar_normal.json'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/block/InfusionPillarBlock.java'
      - 'src/main/resources/assets/thaumcraft/models/block/pillar*'
      - 'src/main/resources/assets/thaumcraft/textures/block/pillar_*'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/block/PedestalBlock.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/blockentity/PedestalBlockEntity.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/PedestalItemRenderer.java'
      - 'src/main/resources/assets/thaumcraft/models/item/alumentum.json'

permissions:
  contents: read

jobs:
  real-minecraft-client:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Install virtual graphics and input utilities
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11-utils xdotool openbox mesa-utils \
            libgl1-mesa-dri libgl1 libxrender1 imagemagick ffmpeg

      - name: Run real Minecraft client and capture its screen
        shell: bash
        env:
          # Videos are reserved for 90%, 95% and 100% user-approved milestones.
          CAPTURE_VIDEO: '0'
        run: bash tools/client_smoke.sh

      - name: Upload ACTUAL client screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thaumcraft-real-client-screenshots
          retention-days: 14
          if-no-files-found: warn
          path: |
            client-smoke-status.txt
            client-smoke/
            run/logs/
            run/crash-reports/

      - name: Upload real Minecraft gameplay video (MP4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thaumcraft-live-client-video
          retention-days: 14
          if-no-files-found: warn
          path: client-smoke/thaumcraft-live-world.mp4
