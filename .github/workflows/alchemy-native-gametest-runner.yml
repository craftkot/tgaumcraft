name: Alchemy native GameTest runner probe

on:
  push:
    branches:
      - validation/alchemy-native-gametest-runner-2026-11-16
      - fix/alchemy-gametest-ci-trigger-2026-11-16
      - fix/alchemy-canary-gametest-trigger-2026-11-17
      - fix/alchemy-gametest-template-2026-11-17
      - fix/alchemy-template-pr-ci-2026-11-17
      - fix/alchemy-template-namespace-2026-11-17
  pull_request:
    branches:
      - integration/alchemy-core-candidate-2026-11-16
      - fix/alchemy-gametest-fail-closed-2026-11-16
      - validation/alchemy-registered-gametest-2026-11-17
      - fix/alchemy-gametest-template-2026-11-17
  workflow_dispatch:

jobs:
  native-gametest-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run native NeoForge GameTest server (infrastructure probe only)
        shell: bash
        run: |
          set -euo pipefail
          echo "Candidate SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          gradle --init-script tools/alchemy-gametest.gradle runAlchemyGameTest --no-daemon --console=plain 2>&1 | tee alchemy-native-gametest.log
      - name: Reject empty or crashed GameTest server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s alchemy-native-gametest.log
          if grep -Eiq 'No test functions were given!|Failed to start the minecraft server|Exception in thread|[[:space:]]BUILD FAILED' alchemy-native-gametest.log; then
            echo 'GameTest server failed or had zero registered tests' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! grep -Eiq '([1-9][0-9]* tests? passed|All [1-9][0-9]* tests? passed|[1-9][0-9]* tests? succeeded)' alchemy-native-gametest.log; then
            echo 'No independently verifiable nonzero GameTest pass count' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Record coverage limitation
        if: always()
        shell: bash
        run: |
          echo 'Native GameTest runner execution does not establish Alchemy gameplay coverage unless registered in-game tests and assertion counts are independently verified.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alchemy-native-gametest-log
          path: alchemy-native-gametest.log
          if-no-files-found: warn
