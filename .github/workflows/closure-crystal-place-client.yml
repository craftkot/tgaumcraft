name: M16 real Minecraft original crystal placement sound

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'tools/client_crystal_place_sound_smoke.py'
      - 'tools/match_crystal_audio_pcm.py'
      - 'tools/verify_crystal_sound.py'
      - 'tools/test_crystal_audio_match.py'
      - '.github/workflows/closure-crystal-place-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/client_crystal_place_sound_smoke.py'
      - 'tools/match_crystal_audio_pcm.py'
      - 'tools/verify_crystal_sound.py'
      - 'tools/test_crystal_audio_match.py'
      - '.github/workflows/closure-crystal-place-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crystal-place-real-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real client and audio tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb x11-utils xdotool openbox mesa-utils \
            libgl1-mesa-dri libgl1 libxrender1 imagemagick ffmpeg \
            pulseaudio pulseaudio-utils
      - name: Original crystal sound and matcher controls
        run: |
          python -m pip install numpy==2.2.6
          python tools/verify_crystal_sound.py
          python tools/test_crystal_audio_match.py
      - name: Generate and syntax-check actual placement smoke
        run: |
          python3 tools/client_crystal_place_sound_smoke.py > client-crystal-place-generated.sh
          bash -n client-crystal-place-generated.sh
      - name: Launch Minecraft and record genuine Aqua placement sound
        run: |
          export XDG_RUNTIME_DIR=/tmp/thaumcraft-client-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tc_crystal_place_sink rate=48000 channels=2
          pactl set-default-sink tc_crystal_place_sink
          bash client-crystal-place-generated.sh
      - name: Upload actual client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m16-crystal-place-original-sound-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            client-smoke-status.txt
            client-smoke/
            run/logs/
            run/crash-reports/
