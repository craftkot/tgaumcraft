name: Closure crystal spread GameTest

on:
  push:
    branches: [feature/closure-near-complete]
    paths:
      - 'build.gradle'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/gametest/**'
      - 'src/main/resources/data/thaumcraft/structure/crystal_spread_empty.nbt'
      - '.github/workflows/closure-crystal-spread-gametest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'build.gradle'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/gametest/**'
      - 'src/main/resources/data/thaumcraft/structure/crystal_spread_empty.nbt'
      - '.github/workflows/closure-crystal-spread-gametest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crystal-spread-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Run native NeoForge GameTests
        run: gradle runGameTestServer --no-daemon

      - name: Upload GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-spread-gametest
          path: |
            run/closure-gametest/logs/**
            run/closure-gametest/crash-reports/**
            build/reports/**
          if-no-files-found: warn
