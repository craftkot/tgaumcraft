name: M16 readable GUI text regression

on:
  push:
    branches:
      - feature/closure-near-complete
    paths:
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/ReadableTextLayout.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/ThaumcraftReadableText.java'
      - 'src/test/java/dev/ehtid/thaumcraft/port/core/ReadableTextLayoutTest.java'
      - 'tools/test_readable_text_layout.sh'
      - 'tools/test_readable_text_client.py'
      - 'src/main/resources/assets/thaumcraft/models/item/jar_brace.json'
      - 'src/main/resources/assets/thaumcraft/models/item/label*.json'
      - 'src/main/resources/assets/thaumcraft/textures/item/jar_brace.png'
      - 'src/main/resources/assets/thaumcraft/textures/item/label*.png'
      - 'tools/verify_label_brace_source_art.py'
      - '.github/workflows/closure-readable-text.yml'
  pull_request:
    paths:
      - 'src/main/java/dev/ehtid/thaumcraft/port/core/ReadableTextLayout.java'
      - 'src/neoforge/java/dev/ehtid/thaumcraft/client/ThaumcraftReadableText.java'
      - 'src/test/java/dev/ehtid/thaumcraft/port/core/ReadableTextLayoutTest.java'
      - 'tools/test_readable_text_layout.sh'
      - 'tools/test_readable_text_client.py'
      - 'src/main/resources/assets/thaumcraft/models/item/jar_brace.json'
      - 'src/main/resources/assets/thaumcraft/models/item/label*.json'
      - 'src/main/resources/assets/thaumcraft/textures/item/jar_brace.png'
      - 'src/main/resources/assets/thaumcraft/textures/item/label*.png'
      - 'tools/verify_label_brace_source_art.py'
      - '.github/workflows/closure-readable-text.yml'

jobs:
  readable-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pixel and grapheme core regression
        run: bash tools/test_readable_text_layout.sh
      - name: Compile real NeoForge GUI helper against minimal test stubs
        run: python3 tools/test_readable_text_client.py
      - name: Verify original BETA26 jar brace and blank/filled label art
        run: python3 tools/verify_label_brace_source_art.py
