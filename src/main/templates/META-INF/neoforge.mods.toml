modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Compatibility-focused port of Thaumcraft 6.1.BETA26 to Minecraft 1.21.1 / NeoForge.
Work in progress: do not treat this stage as a playable release.
'''

[[dependencies.${mod_id}]]
